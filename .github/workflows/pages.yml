# pages.yml — builds the gallery site and publishes it to GitHub Pages.
# The gallery (index.html, assets/, docs/) comes from main; each game is built from its own git tag.
name: Publish gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # we need every game's tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the gallery and every game
        run: ./build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
